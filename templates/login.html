<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 小说⇄漫画 双向转换器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans SC', sans-serif; }
        .manga-border { border: 2px solid #1a1a1a; }
        .panel-shadow { box-shadow: 4px 4px 0px #1a1a1a; }
        .btn-primary {
            background: #1a1a1a;
            color: white;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px #666;
        }
        .btn-primary:disabled {
            transform: none;
            box-shadow: none;
            opacity: 0.6;
            cursor: not-allowed;
        }
        .switch-link {
            color: #1a1a1a;
            text-decoration: underline;
            cursor: pointer;
            transition: color 0.18s ease-out;
        }
        .switch-link:hover { color: #666; }

        /* ===== 入场与反馈动效 ===== */
        :root {
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes cardRise {
            from { opacity: 0; transform: translate3d(0, 18px, 0) scale(0.985); }
            to { opacity: 1; transform: none; }
        }
        @keyframes fieldRise {
            from { opacity: 0; transform: translate3d(0, 10px, 0); }
            to { opacity: 1; transform: none; }
        }
        @keyframes shakeX {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(3px); }
            30%, 50%, 70% { transform: translateX(-5px); }
            40%, 60% { transform: translateX(5px); }
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: none; }
        }
        @keyframes logoPop {
            0% { transform: rotate(-12deg) scale(0.82); opacity: 0; }
            60% { transform: rotate(4deg) scale(1.06); }
            100% { transform: none; opacity: 1; }
        }
        .login-card { animation: cardRise 0.5s var(--ease-out-expo) backwards; }
        .login-card .logo-mark { animation: logoPop 0.6s var(--ease-spring) 0.1s backwards; }
        /* 表单元素依次浮现 */
        .login-card form > * {
            animation: fieldRise 0.45s var(--ease-out-expo) backwards;
            animation-delay: calc(90ms + var(--i, 0) * 70ms);
        }
        #error-message:not(.hidden), #success-message:not(.hidden) { animation: msgIn 0.28s var(--ease-out-expo); }
        .btn-primary:active { transform: translate(0, 0) scale(0.985); box-shadow: 1px 1px 0 #666; }
        .shake { animation: shakeX 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
        :focus-visible { outline: 2px solid #1a1a1a; outline-offset: 2px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                animation-delay: 0s !important;
                transition-duration: 0.01ms !important;
                transition-delay: 0s !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <div class="bg-white p-8 manga-border panel-shadow login-card">
            <div class="flex items-center gap-3 mb-6 justify-center">
                <div class="logo-mark w-12 h-12 bg-black text-white flex items-center justify-center text-2xl font-bold manga-border">⇄</div>
                <h1 class="text-2xl font-bold">小说⇄漫画 双向转换器</h1>
            </div>

            <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded text-sm"></div>
            <div id="success-message" class="hidden mb-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded text-sm"></div>

            <!-- 登录表单 -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">用户名</label>
                    <input type="text" id="login-username" required
                        class="w-full p-3 border-2 border-gray-300 focus:border-black outline-none transition-colors"
                        placeholder="请输入用户名" autocomplete="username">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">密码</label>
                    <input type="password" id="login-password" required
                        class="w-full p-3 border-2 border-gray-300 focus:border-black outline-none transition-colors"
                        placeholder="请输入密码" autocomplete="current-password">
                </div>
                <button type="submit" id="login-btn" class="w-full btn-primary py-3 font-medium text-lg">
                    登录
                </button>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" onsubmit="handleRegister(event)" class="hidden">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">用户名</label>
                    <input type="text" id="reg-username" required
                        class="w-full p-3 border-2 border-gray-300 focus:border-black outline-none transition-colors"
                        placeholder="2-32 字符, 中英文/数字/下划线" autocomplete="username">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">密码</label>
                    <input type="password" id="reg-password" required
                        class="w-full p-3 border-2 border-gray-300 focus:border-black outline-none transition-colors"
                        placeholder="6-64 位" autocomplete="new-password">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-2">确认密码</label>
                    <input type="password" id="reg-confirm" required
                        class="w-full p-3 border-2 border-gray-300 focus:border-black outline-none transition-colors"
                        placeholder="再次输入密码" autocomplete="new-password">
                </div>
                <button type="submit" id="register-btn" class="w-full btn-primary py-3 font-medium text-lg">
                    注册
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-600">
                <span id="switch-text-login">还没有账号?</span>
                <span id="switch-text-register" class="hidden">已有账号?</span>
                <a id="switch-link" class="switch-link font-medium" onclick="toggleMode()">注册新账号</a>
            </div>
        </div>
        <p class="text-center text-gray-500 text-sm mt-4">管理员账号使用 .env 中的凭据 · 普通用户注册即可使用</p>
    </div>

    <script>
        let isRegisterMode = false;

        // 表单字段依次浮现: --i 决定延迟顺序; 切表单时重播一次
        function markFormFields(form) {
            if (!form) return;
            Array.from(form.children).forEach((el, i) => el.style.setProperty('--i', i));
        }

        function replayFormEntrance(form) {
            markFormFields(form);
            Array.from(form.children || []).forEach(el => {
                el.style.animation = 'none';
                void el.offsetWidth;
                el.style.animation = '';
            });
        }

        markFormFields(document.getElementById('login-form'));
        markFormFields(document.getElementById('register-form'));

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const link = document.getElementById('switch-link');
            const textLogin = document.getElementById('switch-text-login');
            const textRegister = document.getElementById('switch-text-register');

            if (isRegisterMode) {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                link.textContent = '返回登录';
                textLogin.classList.add('hidden');
                textRegister.classList.remove('hidden');
            } else {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                link.textContent = '注册新账号';
                textLogin.classList.remove('hidden');
                textRegister.classList.add('hidden');
            }
            // 切过来的表单再浮现一次, 而不是"啪"地整块出现
            replayFormEntrance(isRegisterMode ? registerForm : loginForm);
            hideMessages();
        }

        function showError(msg) {
            const div = document.getElementById('error-message');
            div.textContent = msg;
            div.classList.remove('hidden', 'shake');
            void div.offsetWidth;
            div.classList.add('shake');
            document.getElementById('success-message').classList.add('hidden');
        }

        function showSuccess(msg) {
            const div = document.getElementById('success-message');
            div.textContent = msg;
            div.classList.remove('hidden');
            document.getElementById('error-message').classList.add('hidden');
        }

        function hideMessages() {
            document.getElementById('error-message').classList.add('hidden');
            document.getElementById('success-message').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');

            btn.disabled = true;
            btn.textContent = '登录中...';
            hideMessages();

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();
                if (result.success) {
                    window.location.href = '/app';
                } else {
                    showError(result.error || '登录失败');
                }
            } catch (err) {
                showError('网络错误，请重试');
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            const btn = document.getElementById('register-btn');

            btn.disabled = true;
            btn.textContent = '注册中...';
            hideMessages();

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password, confirm })
                });
                const result = await response.json();
                if (result.success) {
                    showSuccess(result.message || '注册成功, 请登录');
                    // 自动切回登录表单, 并预填用户名
                    document.getElementById('login-username').value = username;
                    document.getElementById('login-password').value = '';
                    setTimeout(() => {
                        if (isRegisterMode) toggleMode();
                    }, 800);
                } else {
                    showError(result.error || '注册失败');
                }
            } catch (err) {
                showError('网络错误，请重试');
            } finally {
                btn.disabled = false;
                btn.textContent = '注册';
            }
        }
    </script>
</body>
</html>
